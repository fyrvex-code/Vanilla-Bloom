<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Bloom — Технические работы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --deep-purple: #0a0514;
            --dark-lilac: #2d1b4e;
            --soft-pink: #ffb7d5;
            --gold-sunset: #ffd700;
            --light-lilac: #e6d5f7;
            --white: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--deep-purple);
            color: var(--white);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Background Layers */
        .bg-layer {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            pointer-events: none;
            will-change: transform;
        }

        .bg-layer-1 {
            width: 90vw;
            height: 90vw;
            background: radial-gradient(circle, rgba(255,126,95,0.45) 0%, transparent 60%);
            top: -25%;
            left: -15%;
            animation: drift 28s infinite ease-in-out;
        }

        .bg-layer-2 {
            width: 75vw;
            height: 75vw;
            background: radial-gradient(circle, rgba(74,44,106,0.55) 0%, transparent 55%);
            bottom: -20%;
            right: -15%;
            animation: drift 34s infinite ease-in-out reverse;
        }

        .bg-layer-3 {
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, rgba(255,183,213,0.3) 0%, transparent 50%);
            top: 35%;
            left: 25%;
            animation: drift 24s infinite ease-in-out;
        }

        .bg-layer-4 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 45%);
            top: 5%;
            right: 15%;
            animation: drift 30s infinite ease-in-out reverse;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(35px, -45px) scale(1.06); }
            66% { transform: translate(-25px, 25px) scale(0.94); }
        }

        /* Cursor Glow */
        .cursor-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,183,213,0.1) 0%, rgba(255,215,0,0.04) 40%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease;
            mix-blend-mode: screen;
        }

        /* Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* Main Card */
        .main-card {
            position: relative;
            z-index: 10;
            max-width: 640px;
            width: 92%;
            padding: clamp(36px, 5vw, 60px);
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(36px) saturate(150%);
            -webkit-backdrop-filter: blur(36px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow:
                0 32px 64px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 100px rgba(255,183,213,0.07);
            animation: cardAppear 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform-style: preserve-3d;
            will-change: transform;
            text-align: center;
        }

        .card-glow {
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(255,183,213,0.22), rgba(255,215,0,0.12), rgba(138,43,226,0.18));
            z-index: -1;
            filter: blur(24px);
            opacity: 0.45;
            animation: pulseGlow 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(50px) scale(0.92) rotateX(5deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
        }

        /* Brand Name */
        .brand {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.7rem, 2.2vw, 1.1rem);
            letter-spacing: 0.15em;
            line-height: 1.6;
            margin-bottom: 28px;
            background: linear-gradient(90deg, #ffd700, #ffb7d5, #e6d5f7, #ffd700);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s linear infinite, textAppear 1s 0.2s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            filter: drop-shadow(0 0 20px rgba(255,183,213,0.3));
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Title */
        .title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.85rem, 3vw, 1.5rem);
            font-weight: 400;
            color: var(--white);
            text-align: center;
            letter-spacing: 0.08em;
            line-height: 1.6;
            margin-bottom: 28px;
            text-shadow:
                0 0 20px rgba(255,255,255,0.35),
                0 0 50px rgba(255,183,213,0.2),
                0 0 100px rgba(255,183,213,0.08);
            animation:
                textAppear 1s 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards,
                breathe 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 1; transform: scale(1); filter: brightness(1); }
            50% { opacity: 0.9; transform: scale(1.012); filter: brightness(1.06); }
        }

        @keyframes textAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,183,213,0.6), transparent);
            margin: 0 auto 28px;
            border-radius: 2px;
            animation: textAppear 1s 0.65s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        /* Description */
        .description {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: rgba(255,255,255,0.72);
            text-align: center;
            line-height: 1.7;
            font-weight: 300;
            letter-spacing: 0.02em;
            animation: textAppear 1s 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        /* Loader */
        .loader-container {
            margin-top: 44px;
            width: 100%;
            animation: textAppear 1s 1.1s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .loader-track {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.07);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,126,95,0.85) 20%,
                rgba(255,183,213,0.95) 40%,
                rgba(255,215,0,0.85) 60%,
                rgba(255,183,213,0.95) 80%,
                transparent 100%);
            background-size: 200% 100%;
            border-radius: 3px;
            animation:
                loadSlide 4s cubic-bezier(0.45, 0, 0.55, 1) infinite,
                shimmer 2.5s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255,183,213,0.5));
        }

        @keyframes loadSlide {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(220%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .main-card {
                width: 94%;
                padding: 32px 24px;
                border-radius: 22px;
            }
            .cursor-glow {
                display: none;
            }
            .brand {
                letter-spacing: 0.1em;
            }
            .title {
                letter-spacing: 0.05em;
                line-height: 1.7;
            }
        }

        @media (max-width: 380px) {
            .brand {
                font-size: 0.6rem;
            }
            .title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer bg-layer-1" data-speed="0.02"></div>
    <div class="bg-layer bg-layer-2" data-speed="-0.03"></div>
    <div class="bg-layer bg-layer-3" data-speed="0.015"></div>
    <div class="bg-layer bg-layer-4" data-speed="-0.02"></div>

    <div class="cursor-glow" id="cursorGlow"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="main-card" id="mainCard">
        <div class="card-glow"></div>
        <div class="brand">VANILLA BLOOM</div>
        <h1 class="title">САЙТ НА ТЕХНИЧЕСКОМ ПЕРЕРЫВЕ</h1>
        <div class="divider"></div>
        <p class="description">
            Мы проводим технические работы, чтобы сделать Vanilla Bloom ещё лучше.<br>
            Совсем скоро сайт снова станет доступен.
        </p>
        <div class="loader-container">
            <div class="loader-track">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetMouseX = mouseX;
            let targetMouseY = mouseY;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const petalColors = [
                'rgba(255, 183, 213, 0.5)',
                'rgba(255, 160, 200, 0.4)',
                'rgba(255, 200, 220, 0.35)',
                'rgba(255, 180, 210, 0.45)'
            ];

            const petals = [];
            const petalCount = Math.min(40, Math.floor(window.innerWidth / 30));

            for (let i = 0; i < petalCount; i++) {
                petals.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 6 + 3,
                    speedY: Math.random() * 0.7 + 0.25,
                    speedX: Math.random() * 0.5 - 0.25,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.018,
                    color: petalColors[Math.floor(Math.random() * petalColors.length)],
                    sway: Math.random() * 0.018,
                    swayOffset: Math.random() * Math.PI * 2
                });
            }

            const particles = [];
            const particleCount = Math.min(55, Math.floor(window.innerWidth / 25));

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speedY: -(Math.random() * 0.35 + 0.1),
                    speedX: (Math.random() - 0.5) * 0.25,
                    opacity: Math.random() * 0.45 + 0.2,
                    color: Math.random() > 0.6 ? '255, 215, 0' : (Math.random() > 0.3 ? '255, 183, 213' : '230, 213, 247')
                });
            }

            let time = 0;

            function drawPetal(p) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawParticle(p) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = `rgba(${p.color}, 0.5)`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                time += 0.01;

                mouseX += (targetMouseX - mouseX) * 0.08;
                mouseY += (targetMouseY - mouseY) * 0.08;

                for (let p of particles) {
                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(time + p.y * 0.005) * 0.2;

                    if (p.y < -10) {
                        p.y = height + 10;
                        p.x = Math.random() * width;
                    }
                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;

                    drawParticle(p);
                }

                for (let p of petals) {
                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(time * 2 + p.swayOffset) * p.sway;
                    p.rotation += p.rotationSpeed;

                    if (p.y > height + 20) {
                        p.y = -20;
                        p.x = Math.random() * width;
                    }
                    if (p.x < -20) p.x = width + 20;
                    if (p.x > width + 20) p.x = -20;

                    drawPetal(p);
                }

                requestAnimationFrame(animate);
            }
            animate();

            const cursorGlow = document.getElementById('cursorGlow');
            const mainCard = document.getElementById('mainCard');
            const bgLayers = document.querySelectorAll('.bg-layer');
            const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

            if (!isTouchDevice) {
                document.addEventListener('mousemove', (e) => {
                    targetMouseX = e.clientX;
                    targetMouseY = e.clientY;

                    cursorGlow.style.left = e.clientX + 'px';
                    cursorGlow.style.top = e.clientY + 'px';

                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    const moveX = (e.clientX - centerX) / centerX;
                    const moveY = (e.clientY - centerY) / centerY;

                    bgLayers.forEach(layer => {
                        const speed = parseFloat(layer.dataset.speed) || 0.02;
                        layer.style.transform = `translate(${-moveX * speed * 60}px, ${-moveY * speed * 60}px) scale(1)`;
                    });

                    const cardRect = mainCard.getBoundingClientRect();
                    const cardCenterX = cardRect.left + cardRect.width / 2;
                    const cardCenterY = cardRect.top + cardRect.height / 2;
                    const cardMoveX = (e.clientX - cardCenterX) / (window.innerWidth / 2);
                    const cardMoveY = (e.clientY - cardCenterY) / (window.innerHeight / 2);

                    mainCard.style.transform = `perspective(1000px) rotateY(${cardMoveX * 3}deg) rotateX(${-cardMoveY * 3}deg)`;
                });
            } else {
                cursorGlow.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
